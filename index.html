<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1324"><title>Neon Snake | 贪吃蛇</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><div><span class="eyebrow">OPEN SOURCE MINI GAME</span><h1>🐍 NEON SNAKE</h1><p>经典贪吃蛇 · 轻量纯前端游戏</p></div><button id="soundBtn" class="small">🔊 音效</button></header><section class="stats"><div><span>分数 SCORE</span><strong id="score">0</strong></div><div><span>最高 BEST</span><strong id="best">0</strong></div><div><span>难度 LEVEL</span><strong id="level">1</strong></div></section><section class="board-wrap"><canvas id="board" width="480" height="480" aria-label="贪吃蛇棋盘"></canvas><div id="overlay" class="overlay"><div class="panel"><h2 id="overlayTitle">准备好了吗？</h2><p id="overlayText">吃掉发光的食物，别撞到墙或自己。</p><button id="startBtn" class="primary">开始游戏</button></div></div></section><div class="toolbar"><button id="pauseBtn">⏸ 暂停 / 继续</button><button id="restartBtn">↻ 重新开始</button></div><div class="dpad" aria-label="触屏方向键"><button data-dir="up">▲</button><div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></div><footer>电脑：方向键 / WASD 移动，空格暂停 · 手机：滑动棋盘或点击方向键</footer></main><script src="game.js"></script></body></html>
